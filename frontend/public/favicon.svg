<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with emerald gradient matching CRM Lite logo -->
  <rect width="64" height="64" rx="16" fill="url(#crmGrad)" />
  <rect x="1" y="1" width="62" height="31" rx="15" fill="url(#shineGrad)" />

  <!-- Outer compass dial ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95" />

  <!-- Compass cardinal tick marks -->
  <line x1="32" y1="8" x2="32" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="52" x2="32" y2="56" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="8" y1="32" x2="12" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="52" y1="32" x2="56" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Compass faceted needle -->
  <!-- Top-right needle (pointing NE - active sales target) -->
  <polygon points="44.5,19.5 27.5,27.5 32,32" fill="#ffffff" />
  <polygon points="44.5,19.5 36.5,36.5 32,32" fill="#d1fae5" />
  <!-- Bottom-left needle (pointing SW) -->
  <polygon points="19.5,44.5 27.5,27.5 32,32" fill="#a7f3d0" />
  <polygon points="19.5,44.5 36.5,36.5 32,32" fill="#6ee7b7" />

  <!-- Center pivot pin -->
  <circle cx="32" cy="32" r="3.5" fill="#047857" stroke="#ffffff" stroke-width="2" />
</svg>